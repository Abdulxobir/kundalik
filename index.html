function load() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const out = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), s);
  out.offsets = Object.assign({}, DEFAULTS.offsets, s.offsets);
  out.book = Object.assign({}, DEFAULTS.book, s.book);
  out.profile = Object.assign({}, DEFAULTS.profile, s.profile);
  // v2: haftalik rutina Se/Pa/Sh ga o'zgardi — eski saqlangan rejani almashtiradi
  if (s.plan && (s.v || 1) < 2) { out.plan = JSON.parse(JSON.stringify(DEFAULTS.plan)); out.sportDone = {}; }
  // v3: yosh va maqsad aniqlandi — faqat hali o'zgartirilmagan eski standart profilni yangilaydi
  if (s.profile && (s.v || 1) < 3 && s.profile.age === 25 && s.profile.goal === 'ushlash') { out.profile.age = 24; out.profile.goal = 'relyef'; }
  // v4: tayyor taomlarga gramm va uglevod qo'shildi. Foydalanuvchi o'zgartirmagan eski 4 tasini yangilaydi, yetishmayotganlarini qo'shadi
  if (s.foods && (s.v || 1) < 4) {
    const old = { f1: [155, 13], f2: [570, 75], f3: [145, 20], f4: [500, 52] };
    DEFAULTS.foods.filter(f => f.id[0] === 'f').forEach(f => {
      const i = out.foods.findIndex(e => e.id === f.id);
      if (i < 0) out.foods.push(Object.assign({}, f));
      else if (old[f.id] && out.foods[i].kcal === old[f.id][0] && out.foods[i].p === old[f.id][1]) out.foods[i] = Object.assign({}, f);
    });
  }
  // v5: yog' qo'shildi va kunlik ratsion taomlari ro'yxat boshiga qo'shildi
  if (s.foods && (s.v || 1) < 5) {
    DEFAULTS.foods.forEach(f => { const e = out.foods.find(x => x.id === f.id); if (e && e.f == null && e.kcal === f.kcal) e.f = f.f; });
    out.foods = DEFAULTS.foods.filter(f => f.id[0] === 'd' && !out.foods.some(x => x.id === f.id)).map(f => Object.assign({}, f)).concat(out.foods);
  }

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const U = { tab: 'today', sportDay: (new Date().getDay() + 6) % 7, cat: 'all', qtab: 'notes', q: '', sheet: null, rest: null, remEdit: false, stab: 'gym', foodEdit: false, ftab: 'day', rper: 'm', rmet: 'p', rsel: null, ptab: 'main', rp: 'm', rpOff: 0, psel: null, presetEdit: false };

/* ---------- Namoz vaqtlari (astronomik hisob, Hanafiy asr) ---------- */
function prayerTimes(date, lat, lng) {
  const R = Math.PI / 180, sin = d => Math.sin(d * R), cos = d => Math.cos(d * R), tan = d => Math.tan(d * R);
  const asin = x => Math.asin(x) / R, acos = x => Math.acos(Math.max(-1, Math.min(1, x))) / R, atan2 = (y, x) => Math.atan2(y, x) / R;
  const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
  const tz = -date.getTimezoneOffset() / 60;
  let y = date.getFullYear(), m = date.getMonth() + 1; const d = date.getDate();
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5 - lng / (15 * 24);
  const sun = t => {
    const D = jd + t - 2451545.0, g = fix(357.529 + 0.98560028 * D, 360), q = fix(280.459 + 0.98564736 * D, 360);
    const L = fix(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360), e = 23.439 - 0.00000036 * D;
    return { decl: asin(sin(e) * sin(L)), eqt: q / 15 - fix(atan2(cos(e) * sin(L), cos(L)) / 15, 24) };
  };
  const mid = t => fix(12 - sun(t).eqt, 24);
  const angle = (a, t, before) => {
    const dc = sun(t).decl;
    const T = acos((-sin(a) - sin(dc) * sin(lat)) / (cos(dc) * cos(lat))) / 15;
    return mid(t) + (before ? -T : T);
  };
  const asr = t => { const dc = sun(t).decl; return angle(-Math.atan(1 / (2 + tan(Math.abs(lat - dc)))) / R, t); };
  const adj = h => h + tz - lng / 15;
  const raw = {
    fajr: adj(angle(15, 5 / 24, true)), sunrise: adj(angle(0.833, 6 / 24, true)), dhuhr: adj(mid(12 / 24)),
    asr: adj(asr(13 / 24)), maghrib: adj(angle(0.833, 18 / 24)), isha: adj(angle(15, 18 / 24))
  };
  const out = {};
  for (const k in raw) out[k] = Math.round(fix(raw[k], 24) * 60) + (TUNE[k] || 0);
  return out;
}
// Rasmiy taqvimdagi ehtiyot daqiqalari (namozvaqti.uz bilan solishtirib tanlangan)
const TUNE = { fajr: -1, sunrise: 2, dhuhr: 4, asr: -1, maghrib: 2, isha: 0 };
const ptKey = () => today() + '|' + S.city;
// Bugungi vaqtlar: internetdan olingan bo'lsa o'sha, bo'lmasa oflayn hisob; ustiga foydalanuvchi tuzatishi
function timesFor(date) {
  const c = CITIES[S.city] || CITIES["Qo'qon"], cached = S.pt && S.pt.key === dkey(date) + '|' + S.city;
  const base = cached ? S.pt.t : prayerTimes(date, c[0], c[1]), out = {};
  for (const k in base) out[k] = base[k] + (S.offsets[k] || 0);
  return out;
}
let ptBusy = false;
async function fetchTimes() {
  if (ptBusy || (S.pt && S.pt.key === ptKey()) || navigator.onLine === false) return;
  ptBusy = true;
  const key = ptKey(), c = CITIES[S.city] || CITIES["Qo'qon"], n = new Date();
  try {
    const r = await fetch('https://api.aladhan.com/v1/timings/' + pad(n.getDate()) + '-' + pad(n.getMonth() + 1) + '-' + n.getFullYear()
      + '?latitude=' + c[0] + '&longitude=' + c[1] + '&method=99&methodSettings=15,null,15&school=1&timezonestring=Asia/Tashkent'
      + '&tune=0,' + [TUNE.fajr, TUNE.sunrise, TUNE.dhuhr, TUNE.asr, TUNE.maghrib, 0, TUNE.isha, 0].join(','));
    const d = (await r.json()).data.timings, m = v => { const p = v.split(':'); return +p[0] * 60 + parseInt(p[1], 10); };
    const t = { fajr: m(d.Fajr), sunrise: m(d.Sunrise), dhuhr: m(d.Dhuhr), asr: m(d.Asr), maghrib: m(d.Maghrib), isha: m(d.Isha) };
    if (Object.values(t).some(isNaN)) throw 0;
    S.pt = { key, t }; save();
    if (!U.sheet && (U.tab === 'today' || U.tab === 'namoz')) render();
  } catch (e) {}
  ptBusy = false;
}
const hm = min => pad(Math.floor(min / 60) % 24) + ':' + pad(min % 60);
function prayerInfo() {
  const now = new Date();
  const t = timesFor(now);

  let next = PRAYERS.find(p => !p.info && t[p.k] > cur), left;
  if (next) left = t[next.k] - cur;

/* ---------- Ovqatlanish hisoboti ---------- */
const METRICS = { kcal: ['Kaloriya', 'kkal', 'kcal'], p: ['Oqsil', 'g', 'prot'], c: ['Uglevod', 'g', 'carb'], f: ["Yog'", 'g', 'fat'] };
const PERIODS = [['w', '7 kun'], ['30', '30 kun'], ['m', 'Shu oy'], ['pm', "O'tgan oy"]];
function periodDays(per) {
  const n = new Date(); let end = new Date(n.getFullYear(), n.getMonth(), n.getDate()), start;
  if (per === 'w' || per === '30') { start = new Date(end); start.setDate(start.getDate() - (per === 'w' ? 6 : 29)); }
  else if (per === 'm') start = new Date(n.getFullYear(), n.getMonth(), 1);
  else { start = new Date(n.getFullYear(), n.getMonth() - 1, 1); end = new Date(n.getFullYear(), n.getMonth(), 0); }
  const out = [];
  for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) out.push(dkey(d));
  return out;
}
function dayTot(k) {
  const l = S.food[k] || [], t = key => l.reduce((a, x) => a + (x[key] || 0), 0);
  return { k, n: l.length, kcal: t('kcal'), p: t('p'), c: t('c'), f: t('f') };
}
const shortDate = k => { const a = k.split('-'); return +a[2] + '-' + MONTHS[+a[1] - 1].slice(0, 3); };
function vReport() {
  const t = targets(), days = periodDays(U.rper), tot = days.map(dayTot), logged = tot.filter(x => x.n), L = logged.length;
  const head = `
  <div class="between row" style="align-items:flex-end">
    <div class="col" style="gap:4px"><div class="eyebrow">${shortDate(days[0])} – ${shortDate(days[days.length - 1])}</div><div class="h1">Hisobot</div></div>
    <button class="chip" data-a="rTab" data-k="day" style="height:40px;border-radius:20px">${svg(I.back, { s: 14, w: 2.4 })} Bugun</button>
  </div>
  <div class="chips">${PERIODS.map(([k, label]) => `<button class="chip${U.rper === k ? ' on' : ''}" data-a="rPer" data-k="${k}">${label}</button>`).join('')}</div>`;
  if (!L) return head + `<div class="card empty">Bu davrda hali ovqat yozilmagan.<br>Ovqatlanish bo'limida kunlik taomlaringizni qo'shib boring — hisobot shu yerda chiqadi.</div>`;

  const rows = Object.keys(METRICS).map(key => {
    const m = METRICS[key], sum = logged.reduce((a, x) => a + x[key], 0), goal = t[m[2]];
    return { key, m, sum, need: goal * L, avg: Math.round(sum / L), goal };
  });
  const protOk = logged.filter(x => x.p >= t.prot).length, kcalOver = logged.filter(x => x.kcal > t.kcal * 1.1).length;
  const M = METRICS[U.rmet], goal = t[M[2]], vals = tot.map(x => x[U.rmet]), max = Math.max(goal, ...vals) * 1.12 || 1;
  if (!U.rsel || !days.includes(U.rsel)) U.rsel = logged[logged.length - 1].k;
  const sel = tot.find(x => x.k === U.rsel);
  return head + `
  <div class="sm" style="line-height:1.5">${days.length} kundan <b style="color:var(--ink)">${L} kun</b> yozilgan. Hisob faqat yozilgan kunlar bo'yicha — yozilmagan kunlar o'rtachaga kirmaydi.</div>

      <span></span><span style="text-align:right">Yedim</span><span style="text-align:right">Kerak edi</span><span style="text-align:right">Kuniga (%)</span></div>
    ${rows.map(r => `<div class="num" style="display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;column-gap:8px;align-items:baseline;font-size:14px;padding:9px 0;border-bottom:1px solid #EEF0EC">
      <span style="font-weight:700">${r.m[0]}<span class="sm" style="font-weight:600"> ${r.m[1]}</span></span>
      <span style="text-align:right;font-weight:800">${money(r.sum)}</span><span style="text-align:right;color:var(--mute)">${money(r.need)}</span>
      <span style="text-align:right"><b>${money(r.avg)}</b><br><span class="sm">${r.goal ? Math.round(r.avg / r.goal * 100) : 0}%</span></span></div>`).join('')}
    <div class="sm" style="padding:8px 0;line-height:1.5">Kunlik me'yor: ${t.kcal} kkal · oqsil ${t.prot} g · uglevod ${t.carb} g · yog' ${t.fat} g</div>
  </div>
  <div class="grid2">
    <div class="card col" style="gap:4px;border-radius:18px"><span class="lbl">Oqsil me'yoriga yetgan kunlar</span><span class="num" style="font-size:22px;font-weight:800">${protOk} <span class="sm">/ ${L}</span></span></div>
    <div class="card col" style="gap:4px;border-radius:18px"><span class="lbl">Kaloriya 10% dan oshgan kunlar</span><span class="num" style="font-size:22px;font-weight:800">${kcalOver} <span class="sm">/ ${L}</span></span></div>
  </div>
  <div class="card col" style="border-radius:22px;gap:10px">
    <div class="chips">${Object.keys(METRICS).map(k => `<button class="chip acc${U.rmet === k ? ' on' : ''}" data-a="rMet" data-k="${k}" style="height:32px;padding:0 12px">${METRICS[k][0]}</button>`).join('')}</div>
    <div class="col" style="gap:2px"><div class="num" style="font-size:15px;font-weight:800">${shortDate(sel.k)}: ${sel.n ? money(sel[U.rmet]) + ' ' + M[1] : "yozilmagan"}</div>
      <div class="sm">${sel.n ? pct(sel[U.rmet], goal) + "% me'yor · " : ''}kesik chiziq — kunlik me'yor (${money(goal)} ${M[1]})</div></div>
    <div style="position:relative;height:150px">
      <div style="position:absolute;left:0;right:0;bottom:${(goal / max * 100).toFixed(1)}%;border-top:1.5px dashed #8A938E;pointer-events:none;z-index:1"></div>
      <div style="position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px">
        ${tot.map(x => `<button class="plain" data-a="rSel" data-k="${x.k}" aria-label="${shortDate(x.k)}: ${x.n ? x[U.rmet] + ' ' + M[1] : 'yozilmagan'}" title="${shortDate(x.k)}: ${x.n ? x[U.rmet] + ' ' + M[1] : 'yozilmagan'}" style="flex:1;min-width:0;height:100%;display:flex;align-items:flex-end">
          <span style="display:block;width:100%;height:${x.n ? Math.max(1.5, x[U.rmet] / max * 100).toFixed(1) : 0}%;background:${x.k === U.rsel ? '#0A2F24' : 'var(--accent)'};border-radius:${days.length > 14 ? 2 : 4}px ${days.length > 14 ? 2 : 4}px 0 0;${x.n ? '' : 'border-bottom:2px solid var(--line)'}"></span></button>`).join('')}

function sheetHTML() {
  const c = U.sheet; if (!c) return '';
  const field = f => f.html != null ? f.html : `<label>${esc(f.label)}${f.type === 'select'
    ? `<select name="${f.k}">${f.options.map(o => `<option${o === f.value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
    : f.type === 'textarea' ? `<textarea name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(f.value)}</textarea>`
    : `<input name="${f.k}" type="${f.type === 'number' ? 'text' : f.type || 'text'}" ${f.type === 'number' ? 'inputmode="numeric" pattern="-?[0-9 ]*"' : ''} value="${esc(f.value)}" placeholder="${esc(f.ph || '')}" autocomplete="off">`}</label>`;
  return `<div class="scrim" data-a="closeSheet"></div>
  <form class="sheet" id="sheetForm" novalidate>
    <div class="between row"><div style="font-size:19px;font-weight:800">${esc(c.title)}</div>
      <button type="button" class="round" data-a="closeSheet" aria-label="Yopish" style="font-size:22px;line-height:1">×</button></div>

}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8); o.start(); o.stop(ctx.currentTime + 0.8);
  } catch (e) {}
}

/* ---------- Taqvim (.ics) eksporti ---------- */
const icsEsc = t => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
const icsLocal = (d, hhmm) => dkey(d).replace(/-/g, '') + 'T' + hhmm.replace(':', '') + '00';
function icsEvent(uid, start, title, mins, daily) {
  return ['BEGIN:VEVENT', 'UID:' + uid + '@kundalik', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
    'DTSTART:' + start, 'DURATION:PT' + mins + 'M', ...(daily ? ['RRULE:FREQ=DAILY'] : []), 'SUMMARY:' + icsEsc(title),
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(title), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT'];
}
const icsWrap = (name, events) => ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kundalik//UZ', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + name, ...events.flat(), 'END:VCALENDAR'].join('\r\n') + '\r\n';
function remindersICS() {
  const d = new Date(), ev = S.reminders.filter(r => /^\d\d:\d\d$/.test(r.time)).map(r => icsEvent('rem-' + r.id, icsLocal(d, r.time), r.label, 15, true));
  if (S.book.remind && S.book.title) ev.push(icsEvent('book', icsLocal(d, S.book.time), 'Kitob: ' + S.book.title + ' — ' + S.book.goal + ' bet', 30, true));
  return icsWrap('Kundalik eslatmalar', ev);
}
function saveICS(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/calendar' })), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);

}

/* ---------- Excel (.xlsx) eksporti — SheetJS kutubxonasi kerak bo'lganda yuklanadi ---------- */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => ok(window.XLSX); sc.onerror = fail; document.head.appendChild(sc);
  });
}
async function exportXLSX(r) {
  let X;
  try { X = await loadXLSX(); } catch (e) { return toast("Excel uchun internet kerak"); }
  const items = (r ? inRange(r) : S.expenses.slice().sort((a, b) => b.ts - a.ts));
  if (!items.length) return toast("Xarajat yo'q");
  const total = sum(items), wb = X.utils.book_new();
  const money0 = (ws, col, from, to) => { for (let i = from; i <= to; i++) { const c = ws[X.utils.encode_cell({ r: i, c: col })]; if (c) c.z = '#,##0'; } };
  // 1. Barcha xarajatlar
  const rows = [['Sana', 'Vaqt', 'Turkum', 'Izoh', "Summa (so'm)"], ...items.map(x => { const d = new Date(x.ts); return [new Date(d.getFullYear(), d.getMonth(), d.getDate()), pad(d.getHours()) + ':' + pad(d.getMinutes()), (CATS[x.cat] || CATS.boshqa).label, x.title, x.amount]; }), ['', '', '', 'Jami', total]];
  const ws1 = X.utils.aoa_to_sheet(rows, { cellDates: true, dateNF: 'dd"."mm"."yyyy' });
  ws1['!cols'] = [{ wch: 12 }, { wch: 7 }, { wch: 18 }, { wch: 28 }, { wch: 14 }]; money0(ws1, 4, 1, rows.length - 1);
  X.utils.book_append_sheet(wb, ws1, 'Xarajatlar');
  // 2. Turkumlar bo'yicha
  const cats = Object.keys(CATS).map(k => [CATS[k].label, items.filter(x => x.cat === k).length, sum(items.filter(x => x.cat === k))]).filter(c => c[2]).sort((a, b) => b[2] - a[2]);
  const rows2 = [['Turkum', 'Soni', "Summa (so'm)", 'Ulushi'], ...cats.map(c => [c[0], c[1], c[2], c[2] / total]), ['Jami', items.length, total, 1]];
  const ws2 = X.utils.aoa_to_sheet(rows2); ws2['!cols'] = [{ wch: 18 }, { wch: 7 }, { wch: 14 }, { wch: 9 }]; money0(ws2, 2, 1, rows2.length - 1);
  for (let i = 1; i < rows2.length; i++) { const c = ws2[X.utils.encode_cell({ r: i, c: 3 })]; if (c) c.z = '0%'; }
  X.utils.book_append_sheet(wb, ws2, 'Turkumlar');
  // 3. Kunlar bo'yicha jami
  const byDay = {}; items.forEach(x => { const k = dkey(new Date(x.ts)); byDay[k] = (byDay[k] || 0) + x.amount; });
  const rows3 = [['Sana', "Summa (so'm)"], ...Object.keys(byDay).sort().map(k => [new Date(k + 'T00:00'), byDay[k]])];
  const ws3 = X.utils.aoa_to_sheet(rows3, { cellDates: true, dateNF: 'dd"."mm"."yyyy' }); ws3['!cols'] = [{ wch: 12 }, { wch: 14 }]; money0(ws3, 1, 1, rows3.length - 1);
  X.utils.book_append_sheet(wb, ws3, 'Kunlar');
  const name = 'kundalik-xarajatlar-' + (r ? dkey(r.s).slice(0, { y: 4, m: 7 }[r.p] || 10) + (r.p === 'w' ? '-hafta' : '') : 'hammasi') + '.xlsx';
  const file = new File([X.write(wb, { bookType: 'xlsx', type: 'array' })], name, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  // Telefonda — ulashish oynasi (Excel, Telegram, Fayllar), kompyuterda — yuklab olish
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); } catch (e) {} return; }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast('Excel fayl yuklab olindi');
}
