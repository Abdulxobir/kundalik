<head>

<style>
:root{--bg:#F2F3EF;--ink:#16201B;--mute:#5E6A64;--line:#E3E6E0;--card:#FFFFFF;--accent:#0E5E46;--amber:#9A5A0C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 18px) 20px 24px;display:flex;flex-direction:column;gap:14px}
.scroll>*{flex-shrink:0}
nav{flex-shrink:0;background:rgba(255,255,255,.94);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;padding:4px 0;color:#6B7570;font-size:11px;font-weight:600;min-height:48px}
nav button.on{color:var(--accent);font-weight:700}
.eyebrow{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.02em;text-transform:uppercase}
.h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;align-items:center}
.between{display:flex;justify-content:space-between}
.col{display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;color:var(--ink);text-align:left;width:100%;font-size:inherit}
.sm{font-size:12px;color:var(--mute)}
.lbl{font-size:12px;font-weight:600;color:var(--mute)}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.round.fill{background:var(--accent);border:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chip{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.acc.on{background:var(--accent);border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.check{width:24px;height:24px;border-radius:12px;border:2px solid #B9C0BB;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{background:var(--accent);border-color:var(--accent)}
.plain{background:none;border:none;padding:0;text-align:left;color:var(--ink)}
.empty{font-size:14px;color:var(--mute);text-align:center;padding:22px 8px;line-height:1.5}
.fab{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 92px);width:60px;height:60px;border-radius:30px;border:none;background:var(--accent);box-shadow:0 8px 20px rgba(14,94,70,.35);display:flex;align-items:center;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(22,32,27,.4);z-index:10}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--mute)}
.sheet input,.sheet select,.sheet textarea{height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:16px;font-weight:600;color:var(--ink);outline:none;width:100%;-webkit-appearance:none;appearance:none}
.sheet textarea{height:120px;padding:12px 14px;resize:none;font-weight:500;line-height:1.45}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--accent)}
.btn{height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:700;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;flex:1}
.btn.danger{color:#A3261B}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--line);border-radius:14px;padding:4px}
.seg button{height:38px;border-radius:10px;border:none;font-size:14px;font-weight:700;background:transparent;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.setbtn{width:40px;height:40px;border-radius:12px;font-size:13px;font-weight:800;padding:0;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.setbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.daybtn{height:60px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;background:#fff;border:1px solid var(--line);color:var(--ink)}
.daybtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY = 'kundalik-v1';
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dkey(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const WEEKDAYS = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
const MONTHS = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
const DAYS = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];

const CITIES = {
  "Qo'qon": [40.5286, 70.9425], 'Toshkent': [41.2995, 69.2401], 'Andijon': [40.7821, 72.3442],
  'Namangan': [40.9983, 71.6726], "Farg'ona": [40.3864, 71.7864], 'Samarqand': [39.6542, 66.9597],
  'Buxoro': [39.7747, 64.4286], 'Navoiy': [40.0844, 65.3792], 'Jizzax': [40.1158, 67.8422],
  'Guliston': [40.4897, 68.7842], 'Qarshi': [38.8606, 65.7891], 'Termiz': [37.2242, 67.2783],
  'Urganch': [41.55, 60.6333], 'Nukus': [42.4531, 59.6103]
};
const PRAYERS = [
  { k: 'fajr', name: 'Bomdod', note: 'Tong' },
  { k: 'sunrise', name: 'Quyosh', note: 'Quyosh chiqishi', info: true },
  { k: 'dhuhr', name: 'Peshin', note: 'Tush' },
  { k: 'asr', name: 'Asr', note: 'Ikkindi' },
  { k: 'maghrib', name: 'Shom', note: 'Kun botishi' },
  { k: 'isha', name: 'Xufton', note: 'Kechki' }
];
const ZIKRS = [
  { name: 'SubhanAlloh', meaning: 'Alloh pokdir', target: 33 },
  { name: 'Alhamdulillah', meaning: 'Hamd Allohga xosdir', target: 33 },
  { name: 'Allohu Akbar', meaning: 'Alloh buyukdir', target: 34 },
  { name: "Astag'firulloh", meaning: "Allohdan mag'firat so'rayman", target: 100 },
  { short: 'Salovat', name: "Allohumma solli 'ala Muhammad", meaning: "Payg'ambarimizga salovot", target: 100 }
];
const CATS = {
  ovqat: { label: 'Oziq-ovqat', bg: '#DCEBE3', fg: '#0E5E46' },
  transport: { label: 'Transport', bg: '#DDE5F0', fg: '#1F3A5F' },
  kitob: { label: 'Kitob', bg: '#F6E7CF', fg: '#9A5A0C' },
  sport: { label: 'Sport', bg: '#EEE3EA', fg: '#5B2E48' },
  boshqa: { label: 'Boshqa', bg: '#E9EBE7', fg: '#3F4A44' }
};
const TAGS = { ISH: '#0E5E46', "G'OYA": '#9A5A0C', KITOB: '#1F3A5F', SHAXSIY: '#5B2E48' };

const DEFAULTS = {
  name: 'Abdulxobir', city: "Qo'qon", budget: 3000000, zikrGoal: 500,
  offsets: { fajr: 0, dhuhr: 0, asr: 0, maghrib: 0, isha: 0 },
  prayers: {},
  zikr: { date: '', sel: 0, count: 0, rounds: 0, total: 0 },
  v: 4,
  plan: [
    { tag: 'Dam', title: 'Dam olish', ex: [] },
    { tag: "Ko'krak", title: "Ko'krak + biceps", ex: [['Shtanga jim (bench press)', '4 × 8', 4], ['Qiya skameykada gantel jim', '3 × 10', 3], ['Krossover', '3 × 12', 3], ['Biceps shtanga', '3 × 10', 3], ["Bolg'a (hammer curl)", '3 × 12', 3]] },
    { tag: 'Dam', title: 'Dam olish', ex: [] },
    { tag: 'Orqa', title: 'Orqa + triceps', ex: [['Turnikda tortilish', '4 × 8', 4], ['Shtanga tortish (row)', '4 × 10', 4], ['Yuqori blok tortish', '3 × 12', 3], ['Fransuzcha jim', '3 × 10', 3], ['Triceps blok', '3 × 12', 3]] },
    { tag: 'Dam', title: 'Dam olish', ex: [] },
    { tag: 'Oyoq', title: 'Oyoq + yelka', ex: [['Prisedaniya', '4 × 8', 4], ['Rumin tortishi', '3 × 10', 3], ['Vipad (lunges)', '3 × 12', 3], ["O'tirib gantel jim", '4 × 10', 4], ["Yon tomonga ko'tarish", '3 × 15', 3]] },
    { tag: 'Dam', title: 'Dam olish', ex: [] }
  ],
  profile: { w: 80, h: 171, age: 24, goal: 'relyef' },
  foods: [
    { id: 'f1', name: '2 ta tuxum', g: 110, kcal: 155, p: 13, c: 1 }, { id: 'f2', name: 'Tovuq grill', g: 300, kcal: 570, p: 75, c: 0 },
    { id: 'f3', name: 'Tvorog', g: 120, kcal: 145, p: 20, c: 4 }, { id: 'f4', name: "Go'sht", g: 200, kcal: 500, p: 52, c: 0 },
    { id: 'f5', name: 'Guruch (pishgan)', g: 200, kcal: 260, p: 5, c: 56 }, { id: 'f6', name: 'Grechka (pishgan)', g: 200, kcal: 220, p: 8, c: 42 },
    { id: 'f7', name: 'Non', g: 100, kcal: 265, p: 8, c: 52 }, { id: 'f8', name: 'Banan 1 ta', g: 120, kcal: 105, p: 1, c: 27 },
    { id: 'f9', name: "Yong'oq", g: 30, kcal: 195, p: 5, c: 4 }, { id: 'f10', name: '1 ta tuxum', g: 55, kcal: 78, p: 6, c: 0 },
    { id: 'f11', name: 'Osh 1 porsiya', g: 350, kcal: 650, p: 22, c: 75 }, { id: 'f12', name: 'Kefir 1 stakan', g: 250, kcal: 130, p: 7, c: 10 }
  ],
  food: {},
  sportDone: {},
  expenses: [],
  notes: [],
  book: { title: '', author: '', page: 0, total: 0, goal: 20, time: '21:00', remind: true, log: {} },
  reminders: [{ id: 'r1', label: 'Vitamin ichish', time: '08:00' }, { id: 'r2', label: "Ota-onaga qo'ng'iroq", time: '18:30' }, { id: 'r3', label: 'Ertangi rejani yozish', time: '22:00' }],
  remDone: {}
};

function load() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const out = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), s);
  out.offsets = Object.assign({}, DEFAULTS.offsets, s.offsets);
  out.book = Object.assign({}, DEFAULTS.book, s.book);
  out.profile = Object.assign({}, DEFAULTS.profile, s.profile);
  // v2: haftalik rutina Se/Pa/Sh ga o'zgardi — eski saqlangan rejani almashtiradi
  if (s.plan && (s.v || 1) < 2) { out.plan = JSON.parse(JSON.stringify(DEFAULTS.plan)); out.sportDone = {}; }
  // v3: yosh va maqsad aniqlandi — faqat hali o'zgartirilmagan eski standart profilni yangilaydi
  if (s.profile && (s.v || 1) < 3 && s.profile.age === 25 && s.profile.goal === 'ushlash') { out.profile.age = 24; out.profile.goal = 'relyef'; }
  // v4: tayyor taomlarga gramm va uglevod qo'shildi. Foydalanuvchi o'zgartirmagan eski 4 tasini yangilaydi, yetishmayotganlarini qo'shadi
  if (s.foods && (s.v || 1) < 4) {
    const old = { f1: [155, 13], f2: [570, 75], f3: [145, 20], f4: [500, 52] };
    DEFAULTS.foods.forEach(f => {
      const i = out.foods.findIndex(e => e.id === f.id);
      if (i < 0) out.foods.push(Object.assign({}, f));
      else if (old[f.id] && out.foods[i].kcal === old[f.id][0] && out.foods[i].p === old[f.id][1]) out.foods[i] = Object.assign({}, f);
    });
  }
  out.v = 4;
  return out;
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const U = { tab: 'today', sportDay: (new Date().getDay() + 6) % 7, cat: 'all', qtab: 'notes', q: '', sheet: null, rest: null, remEdit: false, stab: 'gym', foodEdit: false };

/* ---------- Namoz vaqtlari (astronomik hisob, Hanafiy asr) ---------- */
function prayerTimes(date, lat, lng) {
  const R = Math.PI / 180, sin = d => Math.sin(d * R), cos = d => Math.cos(d * R), tan = d => Math.tan(d * R);
  const asin = x => Math.asin(x) / R, acos = x => Math.acos(Math.max(-1, Math.min(1, x))) / R, atan2 = (y, x) => Math.atan2(y, x) / R;
  const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
  const tz = -date.getTimezoneOffset() / 60;
  let y = date.getFullYear(), m = date.getMonth() + 1; const d = date.getDate();
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5 - lng / (15 * 24);
  const sun = t => {
    const D = jd + t - 2451545.0, g = fix(357.529 + 0.98560028 * D, 360), q = fix(280.459 + 0.98564736 * D, 360);
    const L = fix(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360), e = 23.439 - 0.00000036 * D;
    return { decl: asin(sin(e) * sin(L)), eqt: q / 15 - fix(atan2(cos(e) * sin(L), cos(L)) / 15, 24) };
  };
  const mid = t => fix(12 - sun(t).eqt, 24);
  const angle = (a, t, before) => {
    const dc = sun(t).decl;
    const T = acos((-sin(a) - sin(dc) * sin(lat)) / (cos(dc) * cos(lat))) / 15;
    return mid(t) + (before ? -T : T);
  };
  const asr = t => { const dc = sun(t).decl; return angle(-Math.atan(1 / (2 + tan(Math.abs(lat - dc)))) / R, t); };
  const adj = h => h + tz - lng / 15;
  const raw = {
    fajr: adj(angle(15, 5 / 24, true)), sunrise: adj(angle(0.833, 6 / 24, true)), dhuhr: adj(mid(12 / 24)),
    asr: adj(asr(13 / 24)), maghrib: adj(angle(0.833, 18 / 24)), isha: adj(angle(15, 18 / 24))
  };
  const out = {};
  for (const k in raw) out[k] = Math.round(fix(raw[k], 24) * 60) + (TUNE[k] || 0);
  return out;
}
// Rasmiy taqvimdagi ehtiyot daqiqalari (namozvaqti.uz bilan solishtirib tanlangan)
const TUNE = { fajr: -1, sunrise: 2, dhuhr: 4, asr: -1, maghrib: 2, isha: 0 };
const ptKey = () => today() + '|' + S.city;
// Bugungi vaqtlar: internetdan olingan bo'lsa o'sha, bo'lmasa oflayn hisob; ustiga foydalanuvchi tuzatishi
function timesFor(date) {
  const c = CITIES[S.city] || CITIES["Qo'qon"], cached = S.pt && S.pt.key === dkey(date) + '|' + S.city;
  const base = cached ? S.pt.t : prayerTimes(date, c[0], c[1]), out = {};
  for (const k in base) out[k] = base[k] + (S.offsets[k] || 0);
  return out;
}
let ptBusy = false;
async function fetchTimes() {
  if (ptBusy || (S.pt && S.pt.key === ptKey()) || navigator.onLine === false) return;
  ptBusy = true;
  const key = ptKey(), c = CITIES[S.city] || CITIES["Qo'qon"], n = new Date();
  try {
    const r = await fetch('https://api.aladhan.com/v1/timings/' + pad(n.getDate()) + '-' + pad(n.getMonth() + 1) + '-' + n.getFullYear()
      + '?latitude=' + c[0] + '&longitude=' + c[1] + '&method=99&methodSettings=15,null,15&school=1&timezonestring=Asia/Tashkent'
      + '&tune=0,' + [TUNE.fajr, TUNE.sunrise, TUNE.dhuhr, TUNE.asr, TUNE.maghrib, 0, TUNE.isha, 0].join(','));
    const d = (await r.json()).data.timings, m = v => { const p = v.split(':'); return +p[0] * 60 + parseInt(p[1], 10); };
    const t = { fajr: m(d.Fajr), sunrise: m(d.Sunrise), dhuhr: m(d.Dhuhr), asr: m(d.Asr), maghrib: m(d.Maghrib), isha: m(d.Isha) };
    if (Object.values(t).some(isNaN)) throw 0;
    S.pt = { key, t }; save();
    if (!U.sheet && (U.tab === 'today' || U.tab === 'namoz')) render();
  } catch (e) {}
  ptBusy = false;
}
const hm = min => pad(Math.floor(min / 60) % 24) + ':' + pad(min % 60);
function prayerInfo() {
  const now = new Date();
  const t = timesFor(now);
  const cur = now.getHours() * 60 + now.getMinutes();
  let next = PRAYERS.find(p => !p.info && t[p.k] > cur), left;
  if (next) left = t[next.k] - cur;
  else {
    const tm = new Date(now); tm.setDate(tm.getDate() + 1);
    next = PRAYERS[0]; left = timesFor(tm).fajr + 1440 - cur;
  }
  const done = S.prayers[today()] || {};
  const h = Math.floor(left / 60), m = left % 60;
  return { t, next, done, leftText: (h ? h + ' soat ' : '') + m + ' daq', count: PRAYERS.filter(p => !p.info && done[p.k]).length };
}

/* ---------- Yordamchi hisoblar ---------- */
function weekDate(i) { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + i); return dkey(d); }
function sportStats(i) {
  const day = S.plan[i], done = S.sportDone[weekDate(i)] || {};
  let total = 0, n = 0;
  day.ex.forEach((e, ei) => { for (let k = 0; k < e[2]; k++) { total++; if (done[ei + '-' + k]) n++; } });
  return { day, done, total, n };
}
function zikr() {
  if (S.zikr.date !== today()) { S.zikr = { date: today(), sel: S.zikr.sel || 0, count: 0, rounds: 0, total: 0 }; save(); }
  return S.zikr;
}
function monthSpent() {
  const n = new Date();
  return S.expenses.filter(x => { const d = new Date(x.ts); return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear(); });
}
const sum = a => a.reduce((s, x) => s + x.amount, 0);
function whenText(ts) {
  const d = new Date(ts), y = new Date(); y.setDate(y.getDate() - 1);
  if (dkey(d) === today()) return 'Bugun, ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (dkey(d) === dkey(y)) return 'Kecha';
  return d.getDate() + '-' + MONTHS[d.getMonth()].slice(0, 3);
}
function streak() {
  const d = new Date(); let n = 0;
  if (!S.book.log[dkey(d)]) d.setDate(d.getDate() - 1);
  while (S.book.log[dkey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const GOALS = { relyef: ["Relyef (muskul + yog' kamaytirish)", -200, 2], ozish: ['Ozish', -400, 2], ushlash: ['Vaznni ushlab turish', 0, 1.8], massa: ['Massa olish', 300, 1.8] };
// Kunlik me'yor: Mifflin-St Jeor (erkak) × 1.45 (haftada 3 mashg'ulot), maqsadga qarab tuzatiladi
function targets() {
  const p = S.profile, g = GOALS[p.goal] || GOALS.ushlash;
  const tdee = (10 * p.w + 6.25 * p.h - 5 * p.age + 5) * 1.45;
  const kcal = Math.round((tdee + g[1]) / 10) * 10, prot = Math.round(p.w * g[2]);
  // Uglevod — oqsil va yog'dan (0.9 g/kg) keyin qolgan kaloriya
  return { kcal, prot, carb: Math.max(0, Math.round((kcal - prot * 4 - p.w * 0.9 * 9) / 4)) };
}
function foodStats() {

  return { list, t, kcal: list.reduce((a, x) => a + x.kcal, 0), prot: list.reduce((a, x) => a + x.p, 0), carb: list.reduce((a, x) => a + (x.c || 0), 0) };
}

function macroCol(label, val, goal, color) {

};

function sheetHTML() {

    : f.type === 'textarea' ? `<textarea name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(f.value)}</textarea>`
    : `<input name="${f.k}" type="${f.type === 'number' ? 'text' : f.type || 'text'}" ${f.type === 'number' ? 'inputmode="numeric" pattern="-?[0-9 ]*"' : ''} value="${esc(f.value)}" placeholder="${esc(f.ph || '')}" autocomplete="off">`}</label>`;
  return `<div class="scrim" data-a="closeSheet"></div>
  <form class="sheet" id="sheetForm" novalidate>

}
const num = v => { const n = parseInt(String(v).replace(/[^\d-]/g, ''), 10); return isNaN(n) ? 0 : n; };

/* ---------- Render ---------- */
const VIEWS = { today: vToday, namoz: vNamoz, zikr: vZikr, sport: vSport, pul: vPul, qaydlar: vQaydlar };
const NAV = [['today', 'Bugun', I.sun], ['namoz', 'Ibodat', I.moon], ['sport', 'Sport', I.gym], ['pul', 'Pul', I.card], ['qaydlar', 'Qaydlar', I.note]];

  const app = document.getElementById('app'), sc = app.querySelector('.scroll');
  const top = sc && lastTab === U.tab ? sc.scrollTop : 0;

  lastTab = U.tab;
}
function openSheet(cfg) { U.sheet = cfg; render(); }
function closeSheet() { U.sheet = null; render(); }
function commit() { save(); render(); fetchTimes(); }

/* ---------- Amallar ---------- */
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8); o.start(); o.stop(ctx.currentTime + 0.8);
  } catch (e) {}
}
let restTimer = null;
function stopRest() { clearInterval(restTimer); restTimer = null; U.rest = null; }

const A = {
  go(d) { U.tab = d.tab; U.remEdit = false; render(); },

  },
  fAdd() { foodSheet(null); },
  fEdit(d) { foodSheet(d.id); },
  goBook() { U.tab = 'qaydlar'; U.qtab = 'book'; render(); },
  closeSheet,
  sheetDelete() { const c = U.sheet; U.sheet = null; c.onDelete(); commit(); },

  settings() {

        { k: 'city', label: 'Shahar', type: 'select', options: Object.keys(CITIES), value: S.city },
        { k: 'budget', label: "Oylik byudjet (so'm)", type: 'number', value: S.budget },
        { k: 'zikrGoal', label: 'Kunlik zikr maqsadi', type: 'number', value: S.zikrGoal },
        { k: 'w', label: 'Vazn (kg)', type: 'number', value: S.profile.w }, { k: 'h', label: "Bo'y (sm)", type: 'number', value: S.profile.h },
        { k: 'age', label: 'Yosh', type: 'number', value: S.profile.age },
        { k: 'goal', label: 'Maqsad', type: 'select', options: Object.values(GOALS).map(g => g[0]), value: (GOALS[S.profile.goal] || GOALS.ushlash)[0] },
        ...PRAYERS.filter(p => !p.info).map(p => ({ k: 'o_' + p.k, label: p.name + ' vaqtini tuzatish (daqiqa, masalan 3 yoki -2)', type: 'number', value: S.offsets[p.k] }))
      ],
      onSave(v) {

        S.profile = { w: num(v.w) || S.profile.w, h: num(v.h) || S.profile.h, age: num(v.age) || S.profile.age, goal: Object.keys(GOALS).find(k => GOALS[k][0] === v.goal) || 'ushlash' };
        S.budget = Math.max(0, num(v.budget)); S.zikrGoal = Math.max(1, num(v.zikrGoal));
        PRAYERS.filter(p => !p.info).forEach(p => S.offsets[p.k] = num(v['o_' + p.k]));
      }
    });
  },

  remToggle(d) { const k = today(); S.remDone[k] = S.remDone[k] || {}; S.remDone[k][d.id] = !S.remDone[k][d.id]; commit(); },
  remEdit() { U.remEdit = !U.remEdit; render(); },
  remDel(d) { S.reminders = S.reminders.filter(r => r.id !== d.id); commit(); },
  remAdd() {
    openSheet({
      title: 'Yangi eslatma', saveLabel: "Qo'shish",
      fields: [{ k: 'label', label: 'Nima haqida', value: '', ph: 'Masalan: Vitamin ichish' }, { k: 'time', label: 'Vaqti', type: 'time', value: '09:00' }],
      onSave(v) { if (!v.label.trim()) return false; S.reminders.push({ id: uid(), label: v.label.trim(), time: v.time || '' }); S.reminders.sort((a, b) => a.time.localeCompare(b.time)); }
    });
  },

  pray(d) { const k = today(); S.prayers[k] = S.prayers[k] || {}; S.prayers[k][d.k] = !S.prayers[k][d.k]; commit(); },

  zPick(d) { const z = zikr(); z.sel = +d.i; z.count = 0; commit(); },
  zTap() { const z = zikr(), t = ZIKRS[z.sel].target; z.total++; if (z.count + 1 >= t) { z.count = 0; z.rounds++; } else z.count++; commit(); },
  zReset() { const z = zikr(); z.count = 0; z.rounds = 0; commit(); },

    }, 1000);
  },
  exAdd() { exSheet(null); },

    });
  },
  bookRead() {
    const b = S.book;
    openSheet({
      title: "Bugun necha bet o'qidingiz?", saveLabel: 'Yozish',
      fields: [{ k: 'n', label: 'Betlar soni', type: 'number', value: b.goal }],
      onSave(v) { const n = num(v.n); if (n <= 0) return false; b.log[today()] = (b.log[today()] || 0) + n; b.page = b.total ? Math.min(b.total, b.page + n) : b.page + n; }

  },
  bookGoal() {

};

const foodData = v => ({ name: v.name.trim(), g: Math.max(0, num(v.g)), kcal: Math.max(0, num(v.kcal)), p: Math.max(0, num(v.p)), c: Math.max(0, num(v.c)) });
function foodSheet(id) {

  openSheet({
    title: x ? 'Taomni tahrirlash' : 'Boshqa taom', saveLabel: x ? 'Saqlash' : "Qo'shish",
    fields: x ? foodFields(x) : [...foodFields(null), { k: 'tpl', label: "Tez qo'shish ro'yxatiga ham saqlansinmi?", type: 'select', options: ["Yo'q", 'Ha'], value: "Yo'q" }],
    onSave(v) {

  });

    fields: [{ k: 'amount', label: "Summa (so'm)", type: 'number', value: x ? x.amount : '', ph: '0' },
      { k: 'title', label: 'Nimaga', value: x ? x.title : '', ph: 'Masalan: Bozor' },
      { k: 'cat', label: 'Turkum', type: 'select', options: labels, value: x ? (CATS[x.cat] || CATS.boshqa).label : (CATS[U.cat] || CATS.ovqat).label }],
    onSave(v) {
      const amount = num(v.amount); if (amount <= 0) return false;
      const cat = Object.keys(CATS).find(k => CATS[k].label === v.cat) || 'boshqa', title = v.title.trim() || CATS[cat].label;
      if (x) Object.assign(x, { amount, title, cat }); else S.expenses.push({ id: uid(), amount, title, cat, ts: Date.now() });
    },
    onDelete: x ? () => { S.expenses = S.expenses.filter(e => e.id !== id); } : null
  });
}
function noteSheet(id) {
  const n = id ? S.notes.find(e => e.id === id) : null;
  openSheet({
    title: n ? 'Qayd' : 'Yangi qayd',
    fields: [{ k: 'tag', label: 'Turkum', type: 'select', options: Object.keys(TAGS), value: n ? n.tag : 'SHAXSIY' },
      { k: 'title', label: 'Sarlavha', value: n ? n.title : '' }, { k: 'body', label: 'Matn', type: 'textarea', value: n ? n.body : '' }],
    onSave(v) {
      if (!v.title.trim() && !v.body.trim()) return false;
      const data = { tag: v.tag, title: v.title.trim() || 'Sarlavhasiz', body: v.body.trim(), ts: Date.now() };
      if (n) Object.assign(n, data); else S.notes.push(Object.assign({ id: uid() }, data));
    },
    onDelete: n ? () => { S.notes = S.notes.filter(e => e.id !== id); } : null
  });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (fn) fn(el.dataset, e);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const c = U.sheet; if (!c) return;
  const v = {}; new FormData(e.target).forEach((val, k) => v[k] = val);
  if (c.onSave(v) === false) { const f = e.target.querySelector('input,textarea'); if (f) f.focus(); return; }
  U.sheet = null; commit();
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  U.q = e.target.value; document.getElementById('notesGrid').innerHTML = notesGrid();
});
// Vaqt o'tishi bilan (namozgacha qolgan vaqt, yangi kun) ekranni yangilab turadi
setInterval(() => { fetchTimes(); if (!U.sheet && (U.tab === 'today' || U.tab === 'namoz') && document.activeElement.tagName !== 'INPUT') render(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { fetchTimes(); if (!U.sheet) render(); } });
window.addEventListener('online', fetchTimes);

render();
fetchTimes();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
